name: Tracking

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tracker:
    name: Create Telegram Tracker
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.telegram.outputs.message_id }}
      build_time: ${{ steps.time.outputs.build_time }}
    steps:
      - name: 🕒 Generate Build Time
        id: time
        run: echo "build_time=$(TZ=Asia/Jakarta date +'%d%m%Y-%H%M')" >> "$GITHUB_OUTPUT"

      - name: 📡 Create Telegram Tracker
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_TIME: ${{ steps.time.outputs.build_time }}
        run: |
          TEXT="🔨 AGNI REFORGE
          ━━━━━━━━━━━━━━━━━━━━
          <code>KSU-AOSP  ⏳  Waiting
          KSU-OEM   ⏳  Waiting
          Non-KSU   ⏳  Waiting</code>
          ━━━━━━━━━━━━━━━━━━━━

          Branch: ${GITHUB_REF_NAME}
          Build: #${BUILD_TIME}
          Run: #${GITHUB_RUN_NUMBER}"

          R="$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}")"

          ID="$(echo "$R" | jq -r '.result.message_id // empty')"
          [ -n "$ID" ] || { echo "$R"; exit 1; }
          echo "message_id=$ID" >> "$GITHUB_OUTPUT"

  telegram-live:
    name: Telegram Live Tracker
    runs-on: ubuntu-latest
    needs: tracker
    env:
      MESSAGE_ID: ${{ needs.tracker.outputs.message_id }}
      BUILD_TIME: ${{ needs.tracker.outputs.build_time }}
    steps:
      - name: 📡 Live Tracking
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          ART_API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          LAST=""

          # URL CDN per varian (diisi setelah job build-nya sukses)
          URL_K=""; URL_O=""; URL_N=""
          TRIED_K=0; TRIED_O=0; TRIED_N=0

          duration() {
            local s="$1"
            [ "$s" -lt 0 ] && s=0
            if [ "$s" -lt 60 ]; then
              echo "${s}s"
            elif [ "$s" -lt 3600 ]; then
              printf '%dm %02ds\n' $((s/60)) $((s%60))
            else
              printf '%dh %02dm %02ds\n' $((s/3600)) $(((s%3600)/60)) $((s%60))
            fi
          }

          step() {
            local j="$1" s c n t start now elapsed

            [ -z "$j" ] || [ "$j" = "null" ] && { echo "⏳  Waiting"; return; }

            s="$(jq -r '.status' <<< "$j")"
            c="$(jq -r '.conclusion // empty' <<< "$j")"

            if [ "$s" = completed ]; then
              if [ "$c" = success ]; then
                echo "✅  Done"
              else
                n="$(jq -r '.steps[] | select(.conclusion=="failure") | .name' <<< "$j" | head -1)"
                echo "❌  ${n:-Failed}"
              fi
              return
            fi

            [ "$s" = queued ] && { echo "⏳  Waiting"; return; }

            if [ "$s" = in_progress ]; then
              n="$(jq -r '.steps[] | select(.status=="in_progress") | .name' <<< "$j" | head -1)"
              [ -n "$n" ] || { echo "🔄  Starting..."; return; }

              t="$(jq -r '.steps[] | select(.status=="in_progress") | .started_at' <<< "$j" | head -1)"
              start="$(date -d "$t" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              elapsed=$((now-start))
              echo "$(duration "$elapsed")  $n"
              return
            fi

            echo "⏳  Waiting"
          }

          # Ambil URL CDN dari artifact kecil "cdnurl-<varian>" yang diupload job build
          get_url() {
            local name="cdnurl-$1" arts aurl tmp
            arts="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${ART_API}?name=${name}")" || return 0
            aurl="$(jq -r '.artifacts[0].archive_download_url // empty' <<< "$arts")"
            [ -n "$aurl" ] || return 0
            tmp="$(mktemp)"
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$aurl" -o "$tmp"; then
              unzip -p "$tmp" cdn_url.txt 2>/dev/null | head -n 1 | tr -d '\r\n'
            fi
            rm -f "$tmp"
          }

          # Tombol download per varian (hanya yang URL-nya sudah ada)
          build_kb() {
            jq -nrc --arg a "$URL_K" --arg o "$URL_O" --arg n "$URL_N" '
              [ (if $a != "" then {text:"📥 Download AOSP",   url:$a} else empty end),
                (if $o != "" then {text:"📥 Download OEM",    url:$o} else empty end),
                (if $n != "" then {text:"📥 Download Non-KSU", url:$n} else empty end) ] as $b
              | if ($b | length) == 0 then "" else {inline_keyboard: ($b | map([.]))} end'
          }

          update() {
            local text="$1" markup="${2:-}" r d key

            key="${text}|${markup}"
            [ "$key" = "$LAST" ] && return 0

            if [ -n "$markup" ]; then
              r="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "message_id=${MESSAGE_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "disable_web_page_preview=true" \
                --data-urlencode "text=${text}" \
                --data-urlencode "reply_markup=${markup}")"
            else
              r="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "message_id=${MESSAGE_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "disable_web_page_preview=true" \
                --data-urlencode "text=${text}")"
            fi

            d="$(jq -r '.description // empty' <<< "$r")"
            if [ "$(jq -r '.ok // false' <<< "$r")" != true ] &&
               [[ "$d" != *"message is not modified"* ]]; then
              echo "Telegram update failed: $d"
              return 1
            fi
            LAST="$key"
          }

          while true; do
            JOBS="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$API")"

            KSU="$(jq -c '.jobs[] | select(.name=="Reforging - KSU-AOSP")' <<< "$JOBS" | head -1)"
            OEM="$(jq -c '.jobs[] | select(.name=="Reforging - KSU-OEM")' <<< "$JOBS" | head -1)"
            NON="$(jq -c '.jobs[] | select(.name=="Reforging - Non-KSU")' <<< "$JOBS" | head -1)"

            KSUS="$(step "$KSU")"
            OEMS="$(step "$OEM")"
            NONS="$(step "$NON")"

            KC="$(jq -r '.conclusion // empty' <<< "$KSU")"
            OC="$(jq -r '.conclusion // empty' <<< "$OEM")"
            NC="$(jq -r '.conclusion // empty' <<< "$NON")"

            # Begitu sebuah varian sukses, ambil URL CDN-nya (satu kali percobaan)
            if [ "$KC" = success ] && [ "$TRIED_K" -eq 0 ]; then URL_K="$(get_url KSU-AOSP)"; TRIED_K=1; fi
            if [ "$OC" = success ] && [ "$TRIED_O" -eq 0 ]; then URL_O="$(get_url KSU-OEM)";  TRIED_O=1; fi
            if [ "$NC" = success ] && [ "$TRIED_N" -eq 0 ]; then URL_N="$(get_url Non-KSU)";  TRIED_N=1; fi

            KEYBOARD="$(build_kb)"

            if [ "$KC" = success ] && [ "$OC" = success ] && [ "$NC" = success ]; then
              TEXT="🔨 AGNI REFORGE
          ━━━━━━━━━━━━━━━━━━━━
          <code>KSU-AOSP  ✅  Done
          KSU-OEM   ✅  Done
          Non-KSU   ✅  Done</code>
          ━━━━━━━━━━━━━━━━━━━━

          Branch: ${GITHUB_REF_NAME}
          Build: #${BUILD_TIME}
          Run: #${GITHUB_RUN_NUMBER}

          ━━━━━━━━━━━━━━━━━━━━
          ✅ All builds completed successfully."

              update "$TEXT" "$KEYBOARD" || true
              exit 0
            fi

            if [ -n "$KC" ] && [ -n "$OC" ] && [ -n "$NC" ]; then
              if [[ "$KC" =~ ^(failure|cancelled|timed_out)$ ]] ||
                 [[ "$OC" =~ ^(failure|cancelled|timed_out)$ ]] ||
                 [[ "$NC" =~ ^(failure|cancelled|timed_out)$ ]]; then
                TEXT="🔨 AGNI REFORGE
          ━━━━━━━━━━━━━━━━━━━━
          <code>KSU-AOSP  ${KSUS}
          KSU-OEM   ${OEMS}
          Non-KSU   ${NONS}</code>
          ━━━━━━━━━━━━━━━━━━━━

          Branch: ${GITHUB_REF_NAME}
          Build: #${BUILD_TIME}
          Run: #${GITHUB_RUN_NUMBER}

          ━━━━━━━━━━━━━━━━━━━━
          ❌ One or more builds failed."

                update "$TEXT" "$KEYBOARD" || true
                exit 0
              fi
            fi

            TEXT="🔨 AGNI REFORGE
          ━━━━━━━━━━━━━━━━━━━━
          <code>KSU-AOSP  ${KSUS}
          KSU-OEM   ${OEMS}
          Non-KSU   ${NONS}</code>
          ━━━━━━━━━━━━━━━━━━━━

          Branch: ${GITHUB_REF_NAME}
          Build: #${BUILD_TIME}
          Run: #${GITHUB_RUN_NUMBER}"

            update "$TEXT" "$KEYBOARD" || true
            sleep 7
          done

  Reforging:
    name: Reforging - ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    needs: tracker
    strategy:
      fail-fast: false
      matrix:
        build_type: [KSU-AOSP, KSU-OEM, Non-KSU]

    env:
      KBUILD_BUILD_USER: Naughty-stuff
      KBUILD_BUILD_HOST: LineageOS
      BUILD_TYPE: ${{ matrix.build_type }}
      REF_NAME: ${{ github.ref_name }}
      BUILD_TIME: ${{ needs.tracker.outputs.build_time }}

    steps:
      - name: 📥 Checkout Kernel
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ⏰ Prepare timezone
        run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison cpio flex aria2 lz4 libssl-dev patchelf rsync zip unzip

      - name: ⚙️ Setup Environment
        run: |
          set -e
          # Nama branch bisa mengandung "/" atau karakter aneh, rapikan untuk nama file/artifact
          SAFE_REF="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"

      - name: ⚙️ Setup Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc

      - name: ⚙️ Setup GCC
        run: |
          git clone --depth=1 --branch main https://github.com/greenforce-project/gcc-arm64 gcc64
          git clone --depth=1 --branch main https://github.com/greenforce-project/gcc-arm gcc32

      - name: 🔐 Setup KernelSU + NoMount
        if: matrix.build_type == 'KSU-AOSP' || matrix.build_type == 'KSU-OEM'
        run: |
          curl -LSs https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh | bash -s main
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: 📱 Patch Panel Dimensions
        shell: bash
        run: |
          set -e

          apply_panel_dimensions() {
              local w="$1"
              local h="$2"

              local files=(
                  "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi"
                  "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi"
              )

              for f in "${files[@]}"; do
                  if [[ -f "$f" ]]; then

                      echo "Patching $f → ${w}x${h}"

                      sed -i \
                        "s/\(qcom,mdss-pan-physical-width-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${w}/" \
                        "$f"

                      sed -i \
                        "s/\(qcom,mdss-pan-physical-height-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${h}/" \
                        "$f"
                  fi
              done
          }

          # KSU-OEM = dimensi OEM (MIUI/OOS); KSU-AOSP & Non-KSU = dimensi AOSP
          if [[ "$BUILD_TYPE" == "KSU-OEM" ]]; then
              apply_panel_dimensions 695 1546
          else
              apply_panel_dimensions 69 156
          fi

      - name: 🧩 Generate Defconfig
        run: make O=out ARCH=arm64 vendor/sweet_defconfig

      - name: 🔨 Build Kernel
        run: |
          CLANG="$HOME/toolchains/neutron-clang"
          GCC64="${GITHUB_WORKSPACE}/gcc64"
          GCC32="${GITHUB_WORKSPACE}/gcc32"
          export PATH="$CLANG/bin:$GCC64/bin:$GCC32/bin:$PATH"
          export CFLAGS_EXTRA="-DBUILD_DATE=$(date +%s)"

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE="$CLANG/aarch64-linux-gnu-" \
            CROSS_COMPILE="$GCC64/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32/bin/arm-eabi-" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            KBUILD_COMPILER_STRING="Neutron clang version 24.0.0"

      - name: ✅ Verify Kernel Build
        run: |
          set -e
          failed=0
          for file in out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtbo.img out/arch/arm64/boot/dtb.img; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing: $file"
              failed=1
            else
              echo "✅ Found: $file"
              ls -lh "$file"
            fi
          done
          [[ "$failed" -eq 0 ]] || { echo "Kernel compilation failed."; exit 1; }

      - name: 📄 Save Defconfig
        run: cp out/.config out/sweet_defconfig.txt

      - name: 📂 Clone AnyKernel3 & Zip
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/Naughty-stuff/anykernel3.git \
            AnyKernel3

          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img

          ZIP_NAME="reforge_${BUILD_TYPE}-${SAFE_REF}-${BUILD_TIME}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*"

      - name: 📤 Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: reforge_${{ matrix.build_type }}-${{ env.SAFE_REF }}-${{ env.BUILD_TIME }}
          path: AnyKernel3/*

      - name: 📤 Upload Defconfig Artifact
        uses: actions/upload-artifact@v7
        with:
          name: configs-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
          path: out/sweet_defconfig.txt

      - name: ☁️ Upload ZIP to CDN
        id: cdn
        continue-on-error: true
        shell: bash
        run: |
          set -e

          RESP="$(curl -sS --fail-with-body -X POST https://cdn.zass.in/upload \
            -F "file=@${ZIP_NAME}")" || { echo "❌ Upload CDN gagal: $RESP"; exit 1; }

          echo "Response CDN: $RESP"

          # Ambil URL pertama dari response: coba sebagai JSON dulu, kalau bukan cari https:// biasa
          URL="$(jq -r '.. | strings | select(test("^https?://"))' <<< "$RESP" 2>/dev/null | head -n 1 || true)"
          if [[ -z "$URL" ]]; then
            URL="$(grep -oE 'https?://[^"[:space:]\\]+' <<< "$RESP" | head -n 1 || true)"
          fi

          [[ -n "$URL" ]] || { echo "❌ URL tidak ditemukan di response CDN"; exit 1; }

          # Hanya terima URL http(s) tanpa spasi
          [[ "$URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "❌ URL tidak valid"; exit 1; }

          echo "✅ CDN URL: $URL"
          printf '%s' "$URL" > cdn_url.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Artifact kecil berisi URL CDN, dibaca oleh job Telegram Live Tracker untuk tombol download
      - name: 🔗 Publish CDN URL for Tracker
        if: steps.cdn.outputs.url != ''
        uses: actions/upload-artifact@v7
        with:
          name: cdnurl-${{ matrix.build_type }}
          path: cdn_url.txt

  final:
    name: Final
    runs-on: ubuntu-latest
    needs: [tracker, Reforging, telegram-live]
    if: always()
    steps:
      - name: 📊 Final Status
        run: |
          echo "AGNI REFORGE FINAL STATUS"
          echo "Tracker       : ${{ needs.tracker.result }}"
          echo "Reforging     : ${{ needs.Reforging.result }}"
          echo "Telegram Live : ${{ needs.telegram-live.result }}"